apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-to-inventory
  namespace: uat
spec:
  selector:
    matchLabels:
      app: hrs-inventory-service
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/uat/sa/hrs-gateway-sa
              - cluster.local/ns/uat/sa/hrs-maintenance-service-sa
              - cluster.local/ns/uat/sa/hrs-order-service-sa
---
