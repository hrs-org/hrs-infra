podAnnotations:
  sidecar.istio.io/inject: "false"

replicaCount: 1

persistence:
  enabled: false

service:
  type: ClusterIP
  port: 9093

extraSecretMounts:
  - name: slack-webhook
    secretName: alertmanager-slack-webhook
    mountPath: /etc/alertmanager/secrets
    readOnly: true

config:
  global:
    resolve_timeout: 5m
  route:
    receiver: slack-receiver
    group_by: [alertname]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
  receivers:
    - name: slack-receiver
      webhook_configs:
        - url_file: /etc/alertmanager/secrets/slack_webhook_url
          send_resolved: true
