apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
    route:
      receiver: slack-receiver
      group_by: ['alertname']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
    receivers:
      - name: slack-receiver
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/slack_webhook_url
            send_resolved: true
            title: >-
              [{{ .Status | toUpper }}] {{ if .CommonLabels.alertname }}{{ .CommonLabels.alertname }}{{ else }}Alertmanager Notification{{ end }}
            text: >-
              {{ range .Alerts }}
              *Alert:* {{ if .Labels.alertname }}{{ .Labels.alertname }}{{ else }}unknown{{ end }}
              *Severity:* {{ if .Labels.severity }}{{ .Labels.severity }}{{ else if .Labels.priority }}{{ .Labels.priority }}{{ else }}n/a{{ end }}
              *Details:* {{ if .Annotations.description }}{{ .Annotations.description }}{{ else if .Annotations.summary }}{{ .Annotations.summary }}{{ else if .Annotations.message }}{{ .Annotations.message }}{{ else }}No details{{ end }}

              {{ end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
          ports:
            - containerPort: 9093
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
            - name: slack-webhook
              mountPath: /etc/alertmanager/secrets
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
        - name: slack-webhook
          secret:
            secretName: alertmanager-slack-webhook
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
spec:
  selector:
    app: alertmanager
  ports:
    - name: http
      port: 9093
      targetPort: http
