apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
data:
  loki.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
    common:
      path_prefix: /loki
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    ruler:
      enable_api: true
      storage:
        type: local
        local:
          directory: /loki/rules
      alertmanager_url: http://alertmanager:9093
      enable_alertmanager_v2: true
      rule_path: /tmp/loki/rules-temp
    limits_config:
      retention_period: 168h
      allow_structured_metadata: true
    analytics:
      reporting_enabled: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-rules
data:
  hrs-security.yaml: |
    groups:
      - name: hrs-security
        rules:
          - alert: AuthFailureBurst
            expr: sum(count_over_time({namespace="uat", event_type=~"gateway.authorization_denied|payment.authorization_denied"}[5m])) > 10
            for: 5m
            labels:
              severity: high
              category: auth
            annotations:
              summary: Repeated authentication or authorization failures detected
              description: More than 10 auth failures in 5 minutes across gateway and payment services.

          - alert: RbacPrivilegeEscalationProbe
            expr: sum(count_over_time({namespace="uat", event_type=~"gateway.authorization_denied|payment.authorization_denied", required_permission=~"(write|update|delete):.*"}[10m])) > 8
            for: 5m
            labels:
              severity: high
              category: rbac
            annotations:
              summary: Repeated denied attempts on privileged permissions
              description: Excessive denied access attempts for write/update/delete scopes in 10 minutes.

          - alert: PaymentAnomalyBurst
            expr: sum(count_over_time({namespace="uat", event_type=~"payment.declined|payment.failed"}[5m])) > 5
            for: 5m
            labels:
              severity: high
              category: payment
            annotations:
              summary: Payment decline or failure burst detected
              description: More than 5 payment declined or failed events within 5 minutes.

          - alert: ApiAbuseAuthorizationDenials
            expr: sum(count_over_time({namespace="uat", event_type=~"gateway.authorization_denied|payment.authorization_denied"}[1m])) > 30
            for: 2m
            labels:
              severity: critical
              category: abuse
            annotations:
              summary: Potential API abuse pattern detected
              description: Authorization denials exceeded 30 per minute for at least 2 minutes.

          - alert: GatewayAuthorizationDeniedByRouteBurst
            expr: max by (route_id) (sum by (route_id) (count_over_time({namespace="uat", event_type="gateway.authorization_denied", route_id=~".+"}[5m]))) > 10
            for: 5m
            labels:
              severity: high
              category: gateway
            annotations:
              summary: Repeated gateway denials on a route
              description: A single route exceeded 10 authorization denied events in 5 minutes.

          - alert: GatewayUpstreamFailureBurstByCluster
            expr: max by (cluster_id) (sum by (cluster_id) (count_over_time({namespace="uat", event_type="gateway.authorization_denied", cluster_id=~".+", downstream_status_code=~"5.."}[10m]))) > 5
            for: 5m
            labels:
              severity: high
              category: gateway
            annotations:
              summary: Elevated upstream failures by cluster
              description: A gateway cluster exceeded 5 downstream 5xx denied responses in 10 minutes.

          - alert: IngressTlsHandshakeErrorLogBurst
            expr: sum(count_over_time({namespace="ingress-nginx", pod=~"ingress-nginx-controller.*"} |~ "(?i)(ssl_do_handshake\(\) failed|tls handshake|client sent an http request to an https server)" [5m])) > 10
            for: 5m
            labels:
              severity: high
              category: ingress-tls
            annotations:
              summary: Repeated ingress TLS handshake failures in logs
              description: Ingress controller logs show elevated TLS handshake errors over 5 minutes.

          - alert: IngressTlsCertificateErrorLogBurst
            expr: sum(count_over_time({namespace="ingress-nginx", pod=~"ingress-nginx-controller.*"} |~ "(?i)(certificate verify failed|no peer certificate|unknown ca|certificate has expired)" [10m])) > 5
            for: 5m
            labels:
              severity: high
              category: ingress-tls
            annotations:
              summary: Ingress certificate verification failures detected
              description: Ingress logs indicate repeated certificate verification or expiry errors.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      containers:
        - name: loki
          image: grafana/loki:3.0.0
          args:
            - -config.file=/etc/loki/loki.yaml
          ports:
            - containerPort: 3100
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/loki
            - name: data
              mountPath: /loki
            - name: rules
              mountPath: /loki/rules
      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: data
          emptyDir: {}
        - name: rules
          configMap:
            name: loki-rules
---
apiVersion: v1
kind: Service
metadata:
  name: loki
spec:
  selector:
    app: loki
  ports:
    - name: http
      port: 3100
      targetPort: http
