name: Terraform Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment to deploy (uat / prod)"
        required: true
        default: "uat"
        type: choice
        options:
          - uat
          - prod
      action:
        description: "Terraform action"
        required: true
        default: "apply"
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    environment: ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ./env/${{ github.event.inputs.environment }}
        env:
          ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
          ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
          ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}
        run: terraform init

      - name: Terraform Validate
        working-directory: ./env/${{ github.event.inputs.environment }}
        run: terraform validate

      - name: Ensure AKS kubeconfig (best effort)
        working-directory: ./env/${{ github.event.inputs.environment }}
        env:
          ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
          ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
          ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}
        run: |
          set +e
          RESOURCE_GROUP=$(terraform output -raw resource_group 2>/dev/null)
          AKS_NAME=$(terraform output -raw aks_name 2>/dev/null)
          if [ -n "$RESOURCE_GROUP" ] && [ -n "$AKS_NAME" ]; then
            az aks get-credentials \
              --resource-group "$RESOURCE_GROUP" \
              --name "$AKS_NAME" \
              --overwrite-existing
          else
            echo "AKS outputs are not available yet. Continuing without kubeconfig."
          fi
          set -e

      - name: Terraform Plan
        if: ${{ github.event.inputs.action == 'plan' || github.event.inputs.action == 'apply' }}
        working-directory: ./env/${{ github.event.inputs.environment }}
        env:
          ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
          ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
          ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}
        run: |
          terraform plan -input=false -out=tfplan \
            -var-file=${{ github.event.inputs.environment }}.tfvars

      - name: Terraform Apply
        if: ${{ github.event.inputs.action == 'apply' }}
        working-directory: ./env/${{ github.event.inputs.environment }}
        env:
          ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
          ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
          ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}
        run: |
          terraform apply -auto-approve -input=false tfplan

      - name: Terraform Destroy
        if: ${{ github.event.inputs.action == 'destroy' }}
        working-directory: ./env/${{ github.event.inputs.environment }}
        env:
          ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
          ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
          ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}
        run: |
          terraform destroy -auto-approve -input=false \
            -var-file=${{ github.event.inputs.environment }}.tfvars

      - name: Get AKS credentials
        if: ${{ github.event.inputs.action == 'apply' }}
        run: |
          az aks get-credentials \
            --resource-group $(cd env/${{ github.event.inputs.environment }} && terraform output -raw resource_group) \
            --name $(cd env/${{ github.event.inputs.environment }} && terraform output -raw aks_name) \
            --overwrite-existing

      - name: Share outputs with microservices repos
        if: ${{ github.event.inputs.action == 'apply' }}
        working-directory: ./env/${{ github.event.inputs.environment }}
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          ACR_LOGIN_SERVER=$(terraform output -raw acr_login_server)
          AKS_NAME=$(terraform output -raw aks_name)
          RESOURCE_GROUP=$(terraform output -raw resource_group)

          # Share ACR and AKS info with microservices repos
          gh secret set ACR_LOGIN_SERVER --body "$ACR_LOGIN_SERVER" --repo hrs-org/hrs-gateway
          gh secret set AKS_NAME --body "$AKS_NAME" --repo hrs-org/hrs-gateway
          gh secret set RESOURCE_GROUP --body "$RESOURCE_GROUP" --repo hrs-org/hrs-gateway

          gh secret set ACR_LOGIN_SERVER --body "$ACR_LOGIN_SERVER" --repo hrs-org/hrs-user-store-service-api
          gh secret set AKS_NAME --body "$AKS_NAME" --repo hrs-org/hrs-user-store-service-api
          gh secret set RESOURCE_GROUP --body "$RESOURCE_GROUP" --repo hrs-org/hrs-user-store-service-api

          gh secret set ACR_LOGIN_SERVER --body "$ACR_LOGIN_SERVER" --repo hrs-org/hrs-order-service-api
          gh secret set AKS_NAME --body "$AKS_NAME" --repo hrs-org/hrs-order-service-api
          gh secret set RESOURCE_GROUP --body "$RESOURCE_GROUP" --repo hrs-org/hrs-order-service-api

          gh secret set ACR_LOGIN_SERVER --body "$ACR_LOGIN_SERVER" --repo hrs-org/hrs-inventory-service-api
          gh secret set AKS_NAME --body "$AKS_NAME" --repo hrs-org/hrs-inventory-service-api
          gh secret set RESOURCE_GROUP --body "$RESOURCE_GROUP" --repo hrs-org/hrs-inventory-service-api

          gh secret set ACR_LOGIN_SERVER --body "$ACR_LOGIN_SERVER" --repo hrs-org/hrs-payment-service-api
          gh secret set AKS_NAME --body "$AKS_NAME" --repo hrs-org/hrs-payment-service-api
          gh secret set RESOURCE_GROUP --body "$RESOURCE_GROUP" --repo hrs-org/hrs-payment-service-api
