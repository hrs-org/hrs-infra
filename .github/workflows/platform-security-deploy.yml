name: Platform Security Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment to deploy (uat / prod)"
        required: true
        default: "uat"
        type: choice
        options:
          - uat
          - prod
      applyIstioBase:
        description: "Apply Istio base manifests"
        required: true
        default: false
        type: boolean
      applyNamespaceOverlay:
        description: "Apply namespace overlay"
        required: true
        default: true
        type: boolean
      applySecurityPolicies:
        description: "Apply mTLS and AuthorizationPolicy manifests"
        required: true
        default: true
        type: boolean
      applyMonitoringStack:
        description: "Deploy monitoring stack via Helm (Loki, Promtail, Prometheus, Grafana, Alertmanager, Falco)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  deploy-platform-security:
    environment: ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Terraform Init (for outputs)
        working-directory: ./env/${{ github.event.inputs.environment }}
        env:
          ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
          ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
          ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}
        run: terraform init

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group $(cd env/${{ github.event.inputs.environment }} && terraform output -raw resource_group) \
            --name $(cd env/${{ github.event.inputs.environment }} && terraform output -raw aks_name) \
            --overwrite-existing

      - name: Label namespace for Istio sidecar injection
        run: |
          TARGET_NS="${{ github.event.inputs.environment }}"
          kubectl label namespace "$TARGET_NS" istio-injection=enabled --overwrite

      - name: Disable sidecar injection on ingress-nginx-controller
        run: |
          kubectl patch deploy -n ${{ github.event.inputs.environment }} ingress-nginx-controller \
            --type merge -p '{"spec":{"template":{"metadata":{"annotations":{"sidecar.istio.io/inject":"false"}}}}}'

      - name: Preflight manifest path checks
        run: |
          ISTIO_BASE_FILE="k8s/istio/base/istio-install.generated.yaml"
          ISTIO_NAMESPACE_FILE="k8s/istio/base/istio-system-namespace.yaml"
          ISTIO_OVERLAY_PATH="k8s/istio/overlays/${{ github.event.inputs.environment }}"
          SECURITY_PATH="k8s/security/${{ github.event.inputs.environment }}"
          MONITORING_HELM_VALUES_PATH="k8s/monitoring/helm"
          FALCO_HELM_VALUES_FILE="k8s/monitoring/falco-values.yaml"

          echo "ISTIO_BASE_FILE=$ISTIO_BASE_FILE" >> "$GITHUB_ENV"
          echo "ISTIO_NAMESPACE_FILE=$ISTIO_NAMESPACE_FILE" >> "$GITHUB_ENV"
          echo "ISTIO_OVERLAY_PATH=$ISTIO_OVERLAY_PATH" >> "$GITHUB_ENV"
          echo "SECURITY_PATH=$SECURITY_PATH" >> "$GITHUB_ENV"
          echo "MONITORING_HELM_VALUES_PATH=$MONITORING_HELM_VALUES_PATH" >> "$GITHUB_ENV"
          echo "FALCO_HELM_VALUES_FILE=$FALCO_HELM_VALUES_FILE" >> "$GITHUB_ENV"

          if test -f "$ISTIO_BASE_FILE"; then echo "HAS_ISTIO_BASE_FILE=true" >> "$GITHUB_ENV"; else echo "HAS_ISTIO_BASE_FILE=false" >> "$GITHUB_ENV"; fi
          if test -f "$ISTIO_NAMESPACE_FILE"; then echo "HAS_ISTIO_NAMESPACE_FILE=true" >> "$GITHUB_ENV"; else echo "HAS_ISTIO_NAMESPACE_FILE=false" >> "$GITHUB_ENV"; fi
          if test -d "$ISTIO_OVERLAY_PATH"; then echo "HAS_ISTIO_OVERLAY=true" >> "$GITHUB_ENV"; else echo "HAS_ISTIO_OVERLAY=false" >> "$GITHUB_ENV"; fi
          if test -d "$SECURITY_PATH"; then echo "HAS_SECURITY_PATH=true" >> "$GITHUB_ENV"; else echo "HAS_SECURITY_PATH=false" >> "$GITHUB_ENV"; fi
          if test -f "$MONITORING_HELM_VALUES_PATH/prometheus-values.yaml" && \
             test -f "$MONITORING_HELM_VALUES_PATH/alertmanager-values.yaml" && \
             test -f "$MONITORING_HELM_VALUES_PATH/loki-values.yaml" && \
             test -f "$MONITORING_HELM_VALUES_PATH/promtail-values.yaml" && \
             test -f "$MONITORING_HELM_VALUES_PATH/grafana-values.yaml" && \
             test -f "$FALCO_HELM_VALUES_FILE"; then
            echo "HAS_MONITORING_HELM_VALUES=true" >> "$GITHUB_ENV"
          else
            echo "HAS_MONITORING_HELM_VALUES=false" >> "$GITHUB_ENV"
          fi

          echo "Environment: ${{ github.event.inputs.environment }}"
          echo "Istio namespace file exists: $(test -f \"$ISTIO_NAMESPACE_FILE\" && echo yes || echo no)"
          echo "Istio base file exists: $(test -f \"$ISTIO_BASE_FILE\" && echo yes || echo no)"
          echo "Istio overlay exists: $(test -d \"$ISTIO_OVERLAY_PATH\" && echo yes || echo no)"
          echo "Security overlay exists: $(test -d \"$SECURITY_PATH\" && echo yes || echo no)"
          echo "Monitoring Helm values path exists: $(test -d \"$MONITORING_HELM_VALUES_PATH\" && echo yes || echo no)"

      - name: Apply Istio namespace manifest
        if: ${{ github.event.inputs.applyIstioBase == 'true' && env.HAS_ISTIO_NAMESPACE_FILE == 'true' }}
        run: kubectl apply -f "$ISTIO_NAMESPACE_FILE"

      - name: Ensure istio-system namespace exists (fallback)
        if: ${{ github.event.inputs.applyIstioBase == 'true' && env.HAS_ISTIO_NAMESPACE_FILE != 'true' }}
        run: kubectl create namespace istio-system --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Istio base manifests
        if: ${{ github.event.inputs.applyIstioBase == 'true' && env.HAS_ISTIO_BASE_FILE == 'true' }}
        run: |
          kubectl apply -f "$ISTIO_BASE_FILE"

      - name: Warn if Istio base manifest missing
        if: ${{ github.event.inputs.applyIstioBase == 'true' && env.HAS_ISTIO_BASE_FILE != 'true' }}
        run: echo "::warning title=Istio base skipped::Manifest file '$ISTIO_BASE_FILE' does not exist."

      - name: Apply namespace overlay
        if: ${{ github.event.inputs.applyNamespaceOverlay == 'true' && env.HAS_ISTIO_OVERLAY == 'true' }}
        run: kubectl apply -k "$ISTIO_OVERLAY_PATH"

      - name: Warn if namespace overlay missing
        if: ${{ github.event.inputs.applyNamespaceOverlay == 'true' && env.HAS_ISTIO_OVERLAY != 'true' }}
        run: echo "::warning title=Namespace overlay skipped::Overlay path '$ISTIO_OVERLAY_PATH' does not exist."

      - name: Verify Istio policy CRDs
        run: kubectl api-resources | grep -Ei 'authorizationpolicy|peerauthentication'

      - name: Apply security policies
        if: ${{ github.event.inputs.applySecurityPolicies == 'true' && env.HAS_SECURITY_PATH == 'true' }}
        run: kubectl apply -k "$SECURITY_PATH"

      - name: Warn if security policies overlay missing
        if: ${{ github.event.inputs.applySecurityPolicies == 'true' && env.HAS_SECURITY_PATH != 'true' }}
        run: echo "::warning title=Security policies skipped::Overlay path '$SECURITY_PATH' does not exist."

      - name: Remove retired email service resources
        run: |
          TARGET_NS="${{ github.event.inputs.environment }}"
          if kubectl get namespace "$TARGET_NS" >/dev/null 2>&1; then
            kubectl -n "$TARGET_NS" delete deployment hrs-email-service --ignore-not-found=true
            kubectl -n "$TARGET_NS" delete service hrs-email-service --ignore-not-found=true
            kubectl -n "$TARGET_NS" delete authorizationpolicy allow-to-email --ignore-not-found=true
            kubectl -n "$TARGET_NS" delete serviceaccount hrs-email-service-sa --ignore-not-found=true
          else
            echo "::warning title=Namespace missing::Namespace '$TARGET_NS' not found. Email service cleanup skipped."
          fi

      - name: Validate monitoring secret inputs
        if: ${{ github.event.inputs.applyMonitoringStack == 'true' && env.HAS_MONITORING_HELM_VALUES == 'true' }}
        env:
          ALERTMANAGER_SLACK_WEBHOOK_URL: ${{ secrets.ALERTMANAGER_SLACK_WEBHOOK_URL }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: |
          missing=0
          for name in ALERTMANAGER_SLACK_WEBHOOK_URL GRAFANA_ADMIN_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing secret::$name is not set in GitHub environment secrets"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Create/update monitoring runtime secrets
        if: ${{ github.event.inputs.applyMonitoringStack == 'true' && env.HAS_MONITORING_HELM_VALUES == 'true' }}
        env:
          ALERTMANAGER_SLACK_WEBHOOK_URL: ${{ secrets.ALERTMANAGER_SLACK_WEBHOOK_URL }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: |
          kubectl create namespace monitoring --dry-run=client -o yaml | kubectl apply -f -
          kubectl label namespace monitoring istio-injection=enabled --overwrite

          kubectl -n monitoring create secret generic alertmanager-slack-webhook \
            --from-literal=slack_webhook_url="$ALERTMANAGER_SLACK_WEBHOOK_URL" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl -n monitoring create secret generic grafana-admin-credentials \
            --from-literal=admin-user="admin" \
            --from-literal=admin-password="$GRAFANA_ADMIN_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy monitoring stack via Helm
        if: ${{ github.event.inputs.applyMonitoringStack == 'true' && env.HAS_MONITORING_HELM_VALUES == 'true' }}
        run: |
          kubectl -n monitoring delete deploy prometheus grafana loki alertmanager --ignore-not-found=true
          kubectl -n monitoring delete ds promtail --ignore-not-found=true
          kubectl -n monitoring delete svc prometheus grafana loki alertmanager --ignore-not-found=true
          kubectl -n monitoring delete ingress grafana-ingress-uat --ignore-not-found=true
          kubectl -n monitoring delete configmap prometheus-config grafana-datasources grafana-dashboard-provider grafana-security-dashboard loki-config loki-rules promtail-config alertmanager-config --ignore-not-found=true
          kubectl delete clusterrole promtail --ignore-not-found=true
          kubectl delete clusterrolebinding promtail --ignore-not-found=true
          kubectl -n monitoring delete sa promtail --ignore-not-found=true

          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo add falcosecurity https://falcosecurity.github.io/charts
          helm repo update

          helm upgrade --install alertmanager prometheus-community/alertmanager \
            -n monitoring \
            --create-namespace \
            -f k8s/monitoring/helm/alertmanager-values.yaml

          helm upgrade --install prometheus prometheus-community/prometheus \
            -n monitoring \
            --create-namespace \
            -f k8s/monitoring/helm/prometheus-values.yaml

          helm upgrade --install loki grafana/loki \
            -n monitoring \
            --create-namespace \
            -f k8s/monitoring/helm/loki-values.yaml

          helm upgrade --install promtail grafana/promtail \
            -n monitoring \
            --create-namespace \
            -f k8s/monitoring/helm/promtail-values.yaml

          helm upgrade --install grafana grafana/grafana \
            -n monitoring \
            --create-namespace \
            -f k8s/monitoring/helm/grafana-values.yaml

      - name: Deploy Falco via Helm
        if: ${{ github.event.inputs.applyMonitoringStack == 'true' && env.HAS_MONITORING_HELM_VALUES == 'true' }}
        run: |
          kubectl -n monitoring delete daemonset falco --ignore-not-found=true
          kubectl -n monitoring delete configmap falco-config --ignore-not-found=true
          kubectl -n monitoring delete serviceaccount falco --ignore-not-found=true
          kubectl delete clusterrole falco --ignore-not-found=true
          kubectl delete clusterrolebinding falco --ignore-not-found=true

          helm repo add falcosecurity https://falcosecurity.github.io/charts
          helm repo update

          helm upgrade --install falco falcosecurity/falco \
            -n monitoring \
            --create-namespace \
            -f "$FALCO_HELM_VALUES_FILE"

      - name: Warn if monitoring Helm values missing
        if: ${{ github.event.inputs.applyMonitoringStack == 'true' && env.HAS_MONITORING_HELM_VALUES != 'true' }}
        run: echo "::warning title=Monitoring stack skipped::One or more Helm values files are missing under '$MONITORING_HELM_VALUES_PATH'."

      - name: Restart workloads in uat namespace
        if: ${{ github.event.inputs.environment == 'uat' }}
        run: |
          if kubectl get namespace uat >/dev/null 2>&1; then
            kubectl rollout restart deploy -n uat
          else
            echo "::warning title=Namespace missing::Namespace 'uat' not found. Restart skipped."
          fi

      - name: Verify rollout and policy objects
        run: |
          TARGET_NS="${{ github.event.inputs.environment }}"
          if kubectl get namespace "$TARGET_NS" >/dev/null 2>&1; then
            kubectl get pods -n "$TARGET_NS"
            kubectl get peerauthentication,authorizationpolicy -n "$TARGET_NS"
          else
            echo "::warning title=Namespace missing::Namespace '$TARGET_NS' not found. Verification skipped."
          fi

      - name: Verify monitoring stack
        if: ${{ github.event.inputs.applyMonitoringStack == 'true' && env.HAS_MONITORING_HELM_VALUES == 'true' }}
        run: |
          if kubectl get namespace monitoring >/dev/null 2>&1; then
            kubectl get pods -n monitoring
            kubectl get ds -n monitoring falco
            kubectl get svc -n monitoring
            helm list -n monitoring
            kubectl get ingress -n monitoring
            kubectl get certificate -n monitoring || true

            falco_desired_ready="$(kubectl get ds -n monitoring falco -o jsonpath='{.status.desiredNumberScheduled}/{.status.numberReady}')"
            if [ "$falco_desired_ready" != "3/3" ]; then
              echo "::error title=Falco not ready::DaemonSet readiness is $falco_desired_ready, expected 3/3"
              exit 1
            fi

            falco_pod_count="$(kubectl get pods -n monitoring -l app.kubernetes.io/name=falco --no-headers | wc -l | tr -d ' ')"
            falco_ready_count="$(kubectl get pods -n monitoring -l app.kubernetes.io/name=falco --no-headers | awk '$2 == "1/1" && $3 == "Running" {count++} END {print count + 0}')"
            echo "Falco pods ready: $falco_ready_count/$falco_pod_count"
            if [ "$falco_pod_count" -eq 0 ] || [ "$falco_ready_count" -ne "$falco_pod_count" ]; then
              echo "::error title=Falco pods not ready::Expected all Falco pods to be Running and 1/1 ready"
              exit 1
            fi

            if kubectl logs -n monitoring -l app.kubernetes.io/name=falco --tail=200 | grep -Ei 'panic|fatal|traceback|error.*(driver|syscall|init)' >/dev/null 2>&1; then
              echo "::error title=Falco log errors::Recent Falco logs contain startup/runtime errors"
              kubectl logs -n monitoring -l app.kubernetes.io/name=falco --tail=200
              exit 1
            fi

            kubectl rollout status deploy/prometheus-server -n monitoring --timeout=10m
            kubectl rollout status deploy/grafana -n monitoring --timeout=10m
            kubectl rollout status statefulset/loki -n monitoring --timeout=10m
            kubectl rollout status daemonset/promtail -n monitoring --timeout=10m
            kubectl rollout status daemonset/falco -n monitoring --timeout=10m

            PROM_POD="$(kubectl get pods -n monitoring -o name | grep '^pod/prometheus-server-' | head -n1 | cut -d/ -f2)"
            if [ -z "$PROM_POD" ]; then
              echo "::error title=Prometheus missing::No prometheus server pod found in monitoring namespace"
              exit 1
            fi

            kubectl get pod -n monitoring "$PROM_POD" -o jsonpath='{.metadata.annotations.sidecar\.istio\.io/status}' | grep -q 'istio-proxy'
            echo "Prometheus sidecar check passed for pod: $PROM_POD"

            max_attempts=20
            sleep_seconds=15
            attempt=1
            while [ "$attempt" -le "$max_attempts" ]; do
              if ! command -v jq >/dev/null 2>&1; then
                echo "::error title=Missing dependency::jq is required for Prometheus target verification"
                exit 1
              fi

              TARGETS_JSON="$(kubectl get --raw '/api/v1/namespaces/monitoring/services/http:prometheus-server:80/proxy/api/v1/targets?state=active')"
              DOWN_DETAILS="$(echo "$TARGETS_JSON" | jq -r '.data.activeTargets[] | select(.health=="down") | [.labels.job // "unknown", .labels.instance // "unknown", .scrapeUrl // "unknown", .lastError // ""] | @tsv')"

              if [ -n "$DOWN_DETAILS" ]; then
                echo "down_targets_detail (job\tinstance\tscrapeUrl\tlastError):"
                echo "$DOWN_DETAILS"
              fi

              DOWN="$(echo "$TARGETS_JSON" | jq '[.data.activeTargets[] | select(.health=="down") | select(((.scrapeUrl // "") | test(":15090/metrics$")) and ((.lastError // "") | contains("404 Not Found")) | not)] | length')"
              DOWN="${DOWN:-0}"
              echo "unexpected_active_down_targets=$DOWN (attempt $attempt/$max_attempts)"

              if [ "$DOWN" -eq 0 ]; then
                echo "Prometheus target health check passed (no unexpected down targets)"
                break
              fi
              if [ "$attempt" -eq "$max_attempts" ]; then
                echo "::error title=Prometheus targets unhealthy::unexpected_active_down_targets=$DOWN after $max_attempts attempts"
                exit 1
              fi
              sleep "$sleep_seconds"
              attempt=$((attempt + 1))
            done
          else
            echo "::warning title=Namespace missing::Namespace 'monitoring' not found. Verification skipped."
          fi
